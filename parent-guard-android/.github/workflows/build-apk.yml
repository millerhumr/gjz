name: Build APK

on:
  push:
    paths:
      - 'parent-guard-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (manual)
        run: |
          # 下载并安装 Android cmdline-tools
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          echo "=== Downloading cmdline-tools ==="
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          echo "=== Extracting ==="
          unzip -q cmdline.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "=== Installing packages ==="
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdkmanager.log 2>&1
          echo "=== SDK installed ==="
          ls $ANDROID_SDK_ROOT

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > parent-guard-android/local.properties

      - name: Build Parent APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk-tmp
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk-tmp
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools
          cd parent-guard-android
          gradle :app:assembleDebug --no-daemon 2>&1 | tail -100

      - name: Build Child APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools
          cd parent-guard-android
          gradle :child:assembleDebug --no-daemon 2>&1 | tail -100

      - name: Verify APK files
        run: |
          find parent-guard-android -name "*.apk" -type f 2>/dev/null
          ls -la parent-guard-android/app/build/outputs/apk/debug/ 2>/dev/null
          ls -la parent-guard-android/child/build/outputs/apk/debug/ 2>/dev/null

      - name: Upload Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-guard-parent-debug
          path: parent-guard-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Child APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-guard-child-debug
          path: parent-guard-android/child/build/outputs/apk/debug/child-debug.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## 📱 APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **家长端**: parent-guard-parent-debug" >> $GITHUB_STEP_SUMMARY
          echo "- **孩子端**: parent-guard-child-debug" >> $GITHUB_STEP_SUMMARY
          echo "- **服务器**: http://122.51.108.88" >> $GITHUB_STEP_SUMMARY
