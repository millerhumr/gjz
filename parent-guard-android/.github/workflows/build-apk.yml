name: Build APK

on:
  push:
    paths:
      - 'parent-guard-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:  # 手动触发

jobs:
  build:
    # 用预装 Android SDK 的镜像，避免 setup-android action 的坑
    runs-on: ubuntu-latest
    container:
      image: reactivecircus/android-sdk:34-jdk17
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > parent-guard-android/local.properties
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT 2>/dev/null | head -5 || ls $ANDROID_HOME | head -5

      - name: Build Parent APK
        run: cd parent-guard-android && gradle :app:assembleDebug --no-daemon --warning-mode=summary 2>&1 | tail -60

      - name: Build Child APK
        run: cd parent-guard-android && gradle :child:assembleDebug --no-daemon --warning-mode=summary 2>&1 | tail -60

      - name: Verify APK files
        run: |
          echo "=== APK files produced ==="
          find parent-guard-android -name "*.apk" -type f 2>/dev/null
          ls -la parent-guard-android/app/build/outputs/apk/debug/ 2>/dev/null
          ls -la parent-guard-android/child/build/outputs/apk/debug/ 2>/dev/null

      - name: Upload Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-guard-parent-debug
          path: parent-guard-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Child APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-guard-child-debug
          path: parent-guard-android/child/build/outputs/apk/debug/child-debug.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## 📱 APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **家长端**: parent-guard-parent-debug" >> $GITHUB_STEP_SUMMARY
          echo "- **孩子端**: parent-guard-child-debug" >> $GITHUB_STEP_SUMMARY
          echo "- **服务器**: http://122.51.108.88" >> $GITHUB_STEP_SUMMARY
